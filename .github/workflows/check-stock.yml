name: Revisar stock

on:
  schedule:
    # Cada 15 minutos (hora UTC). GitHub puede retrasar unos minutos las ejecuciones.
    - cron: "*/15 * * * *"
  # Permite ejecutarlo a mano desde la pestaña "Actions"
  workflow_dispatch:

permissions:
  contents: write  # necesario para guardar state.json en el repo

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar productos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_stock.py

      - name: Guardar estado si cambió
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Actualizar estado de stock"
            git push
          fi
